name = "bkknex-health-worker"
type = "service"
account_id = ""  # Set via env or wrangler login
workers_dev = true
route = ""  # Deployment route
main = "dist/index.js"
compatibility_date = "2026-09-27"

[env.development]
name = "bkknex-health-worker-dev"
routes = []

[env.production]
name = "bkknex-health-worker"
routes = []

[[env.development.vars]]
AI_PROVIDER = "workers-ai"
VOICE_PROVIDER = "null"
SAFETY_RULESET_VERSION = "1.0.0"
LOG_SAFETY_METADATA = "true"

[[env.production.vars]]
AI_PROVIDER = "workers-ai"
VOICE_PROVIDER = "null"
SAFETY_RULESET_VERSION = "1.0.0"
LOG_SAFETY_METADATA = "true"

[ai]
binding = "AI"

[build]
command = "npm run build"
cwd = "."

[env.development.build]
command = "npm run build:dev"
