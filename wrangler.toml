name = "bkknex-health-worker"
type = "service"
account_id = ""  # Set via env or wrangler login
workers_dev = true
route = ""  # Deployment route

[env.development]
name = "bkknex-health-worker-dev"
routes = []

[env.production]
name = "bkknex-health-worker"
routes = []

[[env.development.vars]]
AI_PROVIDER = "openai"
VOICE_PROVIDER = "null"
SAFETY_RULESET_VERSION = "1.0.0"
LOG_SAFETY_METADATA = "true"

[[env.production.vars]]
AI_PROVIDER = "openai"
VOICE_PROVIDER = "null"
SAFETY_RULESET_VERSION = "1.0.0"
LOG_SAFETY_METADATA = "true"

[build]
command = "npm run build"
cwd = "."
main = "src/index.ts"

[build.upload]
format = "modules"
main = "./dist/index.js"

[env.development.build]
command = "npm run build:dev"

[[r2_buckets]]
binding = "CONVERSATION_CACHE"
bucket_name = "health-conversations"
preview_bucket_name = "health-conversations-preview"
